  /api/v1/plans/{id}/share:
    post:
      tags:
        - Plans
      summary: Share with trusted contacts
      description: "Confirmed plans only. Telling someone’s family about a plan that
        was never accepted is noise, and it leaks the other person’s
        availability before they agreed to anything. Each contact is emailed the
        plan: who with, where and when. `contacts` says what happened to each
        (`emailed`, `no_email`, `failed`, `already_told`); a contact counts as
        told only once an email was sent, and one already told about this plan
        is not emailed again. `shared` is how many of your contacts now know.
        Send `utc_offset_minutes` so the time reads as the user’s own."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 5
                utc_offset_minutes:
                  type: integer
                  minimum: -720
                  maximum: 840
              required:
                - contact_ids
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
