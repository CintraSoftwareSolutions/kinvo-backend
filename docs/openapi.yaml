components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access_token from /auth/login. Lives 30 minutes; refresh with
        /auth/refresh.
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          description: Always an object or array, never a bare scalar.
        meta:
          nullable: true
          type: object
          properties:
            pagination:
              type: object
              properties:
                next_cursor:
                  type: string
                  nullable: true
                has_more:
                  type: boolean
                limit:
                  type: integer
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - BAD_REQUEST
                - AUTH_REQUIRED
                - AUTH_TOKEN_EXPIRED
                - AUTH_TOKEN_INVALID
                - AUTH_INVALID_CREDENTIALS
                - FORBIDDEN
                - ONBOARDING_INCOMPLETE
                - ACCOUNT_SUSPENDED
                - PREMIUM_REQUIRED
                - USER_BLOCKED
                - NOT_FOUND
                - CONFLICT
                - FILE_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
              description: Branch on this. Stable contract — never branch on `message`.
            message:
              type: string
              description: Displayable to the user. May change.
            details:
              nullable: true
              type: object
              description: For VALIDATION_FAILED, keyed by field name with a list of messages.
                For QUOTA_EXCEEDED, paywall context.
    AuthTokens:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Rotates on every use. Always store the newest one.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
