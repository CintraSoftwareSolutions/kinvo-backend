  /api/v1/verification/review:
    get:
      tags:
        - Admin
      summary: The verification queue
      description: "Submitted verifications awaiting a decision. **Oldest first**,
        unlike every other list in this API: a review queue is work to get
        through, and newest-first leaves the person who has waited longest at
        the bottom forever. Half-finished wizards never appear — they are not
        waiting on anybody. Each row carries a short-lived presigned
        `document_url` from the VERIFICATION bucket, minted per request and
        never stored; it is null for social verifications, which have no
        document. Requires the moderator or admin role. Query: `status`
        (pending, approved, rejected — defaults to pending), `limit`, `cursor`."
