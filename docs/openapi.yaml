                  message: Some fields need attention.
                  details: null
        "429":
          description: RATE_LIMITED — Too many requests. Please try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: RATE_LIMITED
                  message: Too many requests. Please try again shortly.
                  details: null
        "500":
          description: INTERNAL_ERROR — Something went wrong on our end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: Something went wrong on our end.
                  details: null
  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Redeem a reset code
      description: Takes the address the code was sent to along with the code itself.
        Single use, one-hour expiry, and the code is destroyed after a handful
        of wrong guesses. Every way of failing — wrong, expired, already used,
        out of attempts, unknown address — answers AUTH_TOKEN_INVALID with one
        message. Revokes every existing session on success, so the app signs in
        again with the new password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 320
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - code
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
