  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Create an account with email and password
      description: Rejects under-18 from the date of birth. Returns 409 if the address
        already exists — including when it was created by Google or Apple
        sign-in, in which case use forgot-password to set a password rather than
        registering.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 320
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                date_of_birth:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                device_id:
                  type: string
                  maxLength: 128
              required:
                - email
                - password
                - display_name
                - date_of_birth
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: VALIDATION_FAILED — Some fields need attention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need attention.
                  details: null
        "409":
          description: CONFLICT — That already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: CONFLICT
                  message: That already exists.
                  details: null
        "429":
