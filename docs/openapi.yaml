  /api/v1/safety/emergency:
    post:
      tags:
        - Safety
      summary: Raise an emergency
      description: Records the event, attaches a position if given, emails every
        trusted contact who has an address (with a map link, the note, and the
        plan the user is on if there is one), and copies the safety team when
        `SAFETY_ALERT_EMAIL` is set. `contacts` says what happened to each
        contact (`emailed`, `no_email`, `failed`); `contacts_notified` counts
        only those emailed; `summary` is what to tell the user. Send
        `utc_offset_minutes` so times in the emails read as the user’s own.
        Contacts are emailed for at most five alerts an hour; every press is
        still recorded. Succeeds even with no contacts configured and says so —
        someone pressing this is having the worst moment this app will be part
        of, and an error is not an acceptable outcome.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - help_requested
                    - location_shared
                    - check_in_missed
                note:
                  type: string
                  maxLength: 500
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                utc_offset_minutes:
                  type: integer
                  minimum: -720
                  maximum: 840
              additionalProperties: false
