        - Calls
      summary: In-call safety action
      description: "`flag`, `end_and_report`, or `send_live_update` (spec §5.7). The
        action is recorded before anything else happens, because the record is
        the point — a pattern of flags against one account is what moderation
        acts on. `end_and_report` ends the call FIRST and then files the report:
        someone reaching for this wants the call to stop. `note` is optional on
        purpose; a person reaching for a safety control mid-call is not in a
        position to write an explanation. `send_live_update` emails the user’s
        trusted contacts that they are on a call, at most five times an hour,
        and tells the user who was reached. The reported user is never told who
        reported them."
