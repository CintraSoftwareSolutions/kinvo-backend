openapi: 3.0.3
info:
  title: Kinvo API
  version: 1.0.0
  description: >-
    REST API for Kinvo, a multi-mode social connection app.


    ## Every response has the same shape


    ```jsonc

    { "success": true,  "data": {}, "meta": null }

    { "success": false, "error": { "code": "AUTH_TOKEN_EXPIRED", "message":
    "...", "details": null } }

    ```


    Branch on `error.code`, never on `message`. Codes are a stable contract;
    messages are user-facing text.


    ## Authentication


    Sign in, then send `Authorization: Bearer <access_token>` on every request.


    | Code | Meaning | What the app should do |

    | --- | --- | --- |

    | `AUTH_REQUIRED` | No token sent | Go to sign-in |

    | `AUTH_TOKEN_EXPIRED` | Access token aged out | Refresh silently, retry the
    request |

    | `AUTH_TOKEN_INVALID` | Bad, revoked, or reused | Log the user out |


    Refresh tokens **rotate**: every call to `/auth/refresh` returns a new one
    and invalidates the old. Store the newest. Reusing an old one is treated as
    theft and signs that device out.


    ## Test accounts


    `sarah.dev@kinvo.test` / `kinvo-dev-password` — and 29 more
    `*.dev@kinvo.test` users, same password.


    ## Not yet available on staging


    Google, Apple and phone OTP return `SERVICE_UNAVAILABLE` — those provider
    accounts are not configured yet. Build the screens; the contract will not
    change.


    ## Units and formats


    - Timestamps: UTC ISO-8601 with `Z`, field names end in `_at`

    - Dates: `YYYY-MM-DD`

    - **Distances: metres.** Format to miles in the app

    - Money: integer minor units plus a currency code

    - A missing value is `null`, never an omitted key. Empty lists are `[]`
