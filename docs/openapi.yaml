  /api/v1/webhooks/video:
    post:
      tags:
        - Calls
      summary: Video provider status callback
      description: "**Not for clients.** The video provider (LiveKit) posts room
        lifecycle events here; the `Authorization` header carries a JWT holding
        a hash of the RAW body, and that is the authentication — there is no
        bearer token. Answers **403** to a missing or invalid signature so the
        provider flags the endpoint rather than retrying a forgery. This is what
        closes a call when the room ends without either app sending a hang-up —
        otherwise a call whose participants both vanish stays `active` forever.
        Idempotent: ending an already-ended call is a no-op, so retries cost
        nothing. It cannot touch entitlement, and a test asserts so."
