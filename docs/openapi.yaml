            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - text
                    - image
                    - video
                    - voice_note
                    - venue_card
                  default: text
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                media_asset_id:
                  type: string
                  format: uuid
                venue_id:
                  type: string
                  format: uuid
                duration_ms:
                  type: integer
                  exclusiveMinimum: true
                  minimum: 0
                  maximum: 600000
                moderation_overridden:
                  type: boolean
              additionalProperties: false
