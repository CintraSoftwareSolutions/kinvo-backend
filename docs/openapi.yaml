        need a `media_asset_id` from a completed upload that you own and that
        was uploaded as the matching kind. Voice notes carry `duration_ms`.
        Spends daily message quota, refunded if the write fails. Answers 403
        with an identical message for every closed-conversation reason —
        blocked, expired, unmatched — so a block cannot be confirmed by
        elimination."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
