  /api/v1/verification/{id}/review:
    post:
      tags:
        - Admin
      summary: Approve or decline a verification
      description: "The decision lives here rather than in the admin panel, so the
        rules hold wherever the call comes from: a second review answers **409**
        rather than overwriting the first, the badge is recomputed from the
        records instead of being set directly, the action is written to the
        admin audit log with the reviewer and their IP, and the user is
        notified. `reason` is REQUIRED when declining — a rejection with nothing
        to act on is not a decision the user can respond to — and refused when
        approving. Requires the moderator or admin role."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
