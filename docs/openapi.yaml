paths:
  /api/v1/health:
    get:
      tags:
        - Meta
      summary: Liveness probe
      description: Checks no dependency on purpose. A liveness probe that fails when
        the database blips makes the orchestrator kill healthy processes.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "429":
          description: RATE_LIMITED — Too many requests. Please try again shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: RATE_LIMITED
                  message: Too many requests. Please try again shortly.
                  details: null
        "500":
          description: INTERNAL_ERROR — Something went wrong on our end.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: Something went wrong on our end.
                  details: null
  /api/v1/health/ready:
    get:
      tags:
