  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request a password reset code
      description: Emails a six-digit code, single use, valid for an hour. Requesting
        a new code retires the previous one. The response is identical whether
        or not the address is registered, so it cannot be used to find out which
        addresses have accounts. An environment with no mail transport — local,
        test, and staging under the integration waiver — returns the code as
        reset_code instead, so the flow stays testable there; production refuses
        to boot without a transport, so it never does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 320
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
