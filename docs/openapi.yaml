      description: "**High-risk data.** Sharing never starts implicitly, every session
        carries a hard expiry set at creation, and starting again ends the
        previous one. Ending a session DESTROYS the position trail — the session
        row survives as the record that sharing happened, the movements do not.
        Maximum 8 hours."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: string
                  format: uuid
                duration_minutes:
