                  message: Something went wrong on our end.
                  details: null
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Sign out this device
      description: Revokes the presented token family only, so other devices stay
        signed in. The device leaves GET /devices and stops receiving push.
        Always succeeds, even for an unknown token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 1
