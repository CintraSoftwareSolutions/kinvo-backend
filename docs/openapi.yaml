  /api/v1/moderation/check:
    post:
      tags:
        - Moderation
      summary: Check content before sending
      description: '**Advisory, never blocking.** `can_send` is always true, at every
        severity — show "Edit message" / "Send anyway" from `should_warn` and
        let the user decide. Send `overridden: true` when they push past a
        warning; that record is what the moderation team needs later. Content is
        hashed, never stored. If the provider is unreachable the call still
        succeeds with `timed_out: true` and severity `none`: a third-party
        outage must never cost a user their message. Scam and payment checks run
        on every mode, not just dating.'
