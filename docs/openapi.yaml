  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Exchange a refresh token for a new pair
      description: Refresh tokens ROTATE. Store the new one every time. Presenting a
        token that has already been rotated is treated as theft and revokes
        every token in that family, signing that device out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 1
              required:
                - refresh_token
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: VALIDATION_FAILED — Some fields need attention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: VALIDATION_FAILED
                  message: Some fields need attention.
                  details: null
        "401":
          description: AUTH_TOKEN_INVALID — Your session is no longer valid. Please sign
            in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: AUTH_TOKEN_INVALID
                  message: Your session is no longer valid. Please sign in again.
                  details: null
        "429":
          description: RATE_LIMITED — Too many requests. Please try again shortly.
          content:
