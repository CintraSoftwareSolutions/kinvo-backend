name: kinvo

services:
  postgres:
    # PostGIS is required from Batch 1 for radius queries on the Discover deck
    # (spec 2). The plain postgres image will not do.
    image: postgis/postgis:16-3.4
    container_name: kinvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinvo
      POSTGRES_PASSWORD: kinvo
      POSTGRES_DB: kinvo_dev
    ports:
      # Non-default host port so this never collides with a local Postgres.
      - '5433:5432'
    volumes:
      - kinvo_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kinvo -d kinvo_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kinvo-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - kinvo_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 for local development and tests.
  #
  # SeaweedFS speaks the S3 API, so the application uses the real AWS SDK against
  # it and nothing about the upload, presigning, or bucket-policy code is a stub.
  # Moving to AWS S3 is a change of endpoint and credentials in .env — no code
  # change. This is not a substitution of the stack (spec 2); it is the same
  # client pointed somewhere local.
  #
  # It replaced MinIO in September 2026, when MinIO's open-source edition was
  # archived and its images and downloads withdrawn. `mini` runs the whole store
  # in one process and creates both buckets on start. They are private because
  # docker/seaweedfs/s3.json defines one identity and no anonymous one. Pinned by
  # digest, as CI is.
  storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: kinvo-storage
    restart: unless-stopped
    command:
      - mini
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=kinvo-media,kinvo-verification
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -master.telemetry=false
    ports:
      # 8333 is the S3 API. 23646 is the admin UI for eyeballing uploads; it has
      # no login, so it listens on this machine only.
      - '9100:8333'
      - '127.0.0.1:9101:23646'
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - kinvo_storage_data:/data

volumes:
  kinvo_postgres_data:
  kinvo_redis_data:
  kinvo_storage_data:
